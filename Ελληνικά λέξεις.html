<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ελληνικά λέξεις</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap">
<style>
/* Layout: одна колонка до 640px; сверху выбор наборов, ниже три режима (диктовка, карточки, тест). Греческое слово крупно, по центру карточки. */
:root{
  --bg:#f1f5f8; --surface:#ffffff; --fg:#0f2230; --muted:#5b7080; --line:#d6e0e7;
  --accent:#0d5ea6; --accent-fg:#ffffff; --accent-soft:#dcebf7;
  --good:#1e7a4d; --good-soft:#dff2e8; --bad:#b3372c; --bad-soft:#f8e1de;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1822; --surface:#12232f; --fg:#e8f0f5; --muted:#92a8b7; --line:#243a49;
    --accent:#5aa8ec; --accent-fg:#06121b; --accent-soft:#17344a;
    --good:#5cc690; --good-soft:#15382a; --bad:#f08a7e; --bad-soft:#41211d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1822; --surface:#12232f; --fg:#e8f0f5; --muted:#92a8b7; --line:#243a49;
  --accent:#5aa8ec; --accent-fg:#06121b; --accent-soft:#17344a;
  --good:#5cc690; --good-soft:#15382a; --bad:#f08a7e; --bad-soft:#41211d;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--serif);font-size:1.6rem;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 2px;font-size:.88rem}

.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.set{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;gap:8px;align-items:baseline;text-align:left;min-width:0}
.set .n{font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums;flex:none}
.set .t{font-size:.76rem;color:var(--muted);line-height:1.25;min-width:0;overflow-wrap:anywhere}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.set[aria-pressed="true"] .t{color:inherit;opacity:.88}
.setbox summary{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.setbox .sel{color:var(--muted);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.setbody{display:flex;flex-direction:column;gap:12px;padding-block:4px 14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.dock .bar{max-width:none}
.dock .ib{width:46px;height:46px}
.dock .ib.main{width:60px;height:60px}
.dock .ib svg{width:20px;height:20px}
.dock .ib.main svg{width:26px;height:26px}
body.has-dock{padding-block-end:calc(150px + env(safe-area-inset-bottom,0px))}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{background:none;border:0;border-radius:9px;padding:10px 6px;font-weight:700;font-size:.92rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.panel{display:flex;flex-direction:column;gap:16px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.gr{font-family:var(--serif);font-size:clamp(2rem,9vw,2.9rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ru{font-size:1.25rem;color:var(--accent);font-weight:600;min-height:1.7em;overflow-wrap:anywhere}
.ru.hide{visibility:hidden}
.meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:100%;max-width:320px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.ctrls{display:flex;justify-content:center;align-items:center;gap:12px}
.ib{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.main{width:68px;height:68px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ib.main svg{width:28px;height:28px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.opts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:14px}
.opt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.opt label{font-size:.92rem}
.opt output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;min-width:3.2em;text-align:right}
.opt input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}

.notice{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.88rem}
.voice{font-size:.82rem;color:var(--muted)}

.card{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;width:100%}
.hint{font-size:.82rem;color:var(--muted)}
[hidden]{display:none!important}
.views{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.view{background:none;border:0;border-radius:9px;padding:11px 6px;font-weight:800;font-size:.98rem;color:var(--muted)}
.view[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.say{font-size:1.12rem;line-height:1.5;max-width:34ch;text-wrap:pretty}
.key{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.gr.gsm{font-size:clamp(1.35rem,6vw,1.9rem);line-height:1.3}
.topics{display:grid;gap:6px}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.topic input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.topic label{display:flex;flex-direction:column;gap:1px;min-width:0;cursor:pointer}
.topic .tt{font-weight:700}
.topic .ts{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.topic.now{border-color:var(--accent);background:var(--accent-soft)}
.topic .ib{width:40px;height:40px}
.topic .ib svg{width:18px;height:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:16px}
.sheet h3{margin:0 0 6px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 10px 4px 0;font-weight:800;white-space:nowrap}
.tbl td{padding:6px 10px 6px 0;border-top:1px solid var(--line);font-family:var(--serif);font-size:.98rem;vertical-align:top}
.tbl td.lab{font-family:var(--sans);font-size:.8rem;color:var(--muted);white-space:nowrap}
.flabel{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;min-height:1.2em}
.forms{width:100%;max-width:360px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;text-align:left;margin-top:4px}
.forms .l{color:var(--muted);font-size:.8rem;align-self:baseline;white-space:nowrap}
.forms .f{font-family:var(--serif);font-size:1.05rem;overflow-wrap:anywhere;min-width:0}
.forms .cur{color:var(--accent);font-weight:700}
.forms .gh{grid-column:1/-1;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:10px}
.forms .gh:first-child{margin-top:0}
.optgrp{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.optgrp h3{margin:0;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}

.answers{display:grid;gap:8px;width:100%}
.ans{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;font-weight:600;overflow-wrap:anywhere}
.ans.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ans.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{font-variant-numeric:tabular-nums;font-weight:700}

details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:700;list-style-position:inside}
.list{display:grid;grid-template-columns:1fr;gap:0;padding-bottom:8px}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;width:100%;text-align:left;align-items:baseline}
.li .g{font-family:var(--serif);font-weight:500;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.li .r{color:var(--muted);font-size:.88rem;text-align:right;min-width:0;overflow-wrap:anywhere}
.li.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Ελληνικά λέξεις</h1>
    <p class="sub">Слова и грамматика с озвучкой. Включи плеер и слушай, хоть в машине.</p>
  </header>

  <div class="views" role="tablist" aria-label="Раздел">
    <button class="view" role="tab" id="v-words" data-view="words" aria-selected="true">Слова</button>
    <button class="view" role="tab" id="v-gram" data-view="gram" aria-selected="false">Грамматика</button>
  </div>

  <details class="setbox" id="setbox">
    <summary><span>Наборы</span><span class="sel" id="sel-sum"></span></summary>
    <div class="setbody">
      <div class="head">
        <span class="count" id="count"></span>
        <div class="row" style="gap:10px">
          <button class="linkbtn" id="all" type="button">Все</button>
          <button class="linkbtn" id="none" type="button">Сбросить</button>
        </div>
      </div>
      <div class="sets" id="sets"></div>
    </div>
  </details>

  <div class="tabs" role="tablist" aria-label="Режим">
    <button class="tab" role="tab" id="t-dict" data-mode="dict" aria-selected="true">Диктовка</button>
    <button class="tab" role="tab" id="t-cards" data-mode="cards" aria-selected="false">Карточки</button>
    <button class="tab" role="tab" id="t-quiz" data-mode="quiz" aria-selected="false">Тест</button>
  </div>

  <div class="notice" id="novoice" hidden></div>

  <!-- ДИКТОВКА -->
  <section class="panel" id="p-dict" role="tabpanel" aria-labelledby="t-dict">
    <div class="stage" aria-live="polite">
      <div class="flabel" id="d-lab"></div>
      <div class="gr" id="d-gr" lang="el"></div>
      <div class="ru" id="d-ru"></div>
      <div class="forms" id="d-forms" lang="el" hidden></div>
    </div>
    <div class="opts">
      <div class="opt"><label for="o-gap">Пауза между словом, переводом и следующим</label><output id="o-gap-v"></output>
        <input id="o-gap" type="range" min="0.5" max="5" step="0.5"></div>
      <div class="opt"><label for="o-rate">Скорость речи</label><output id="o-rate-v"></output>
        <input id="o-rate" type="range" min="0.5" max="1.1" step="0.05"></div>
      <label class="chk"><input id="o-ru" type="checkbox"> Озвучивать перевод по-русски</label>
      <label class="chk"><input id="o-show" type="checkbox"> Показывать перевод сразу</label>
      <label class="chk"><input id="o-shuf" type="checkbox"> Перемешать порядок</label>
      <div class="optgrp">
        <h3>Грамматика в диктовке</h3>
        <label class="chk"><input id="g-case" type="checkbox"> Падежи существительных и род прилагательных</label>
        <label class="chk"><input id="g-pres" type="checkbox"> Настоящее время глаголов</label>
        <label class="chk"><input id="g-past" type="checkbox"> Прошедшее время глаголов</label>
        <label class="chk"><input id="g-fut" type="checkbox"> Будущее время глаголов</label>
        <label class="chk"><input id="g-only" type="checkbox"> Только слова, у которых есть эти формы</label>
        <div class="hint" id="g-count"></div>
      </div>
      <div class="voice" id="voice"></div>
    </div>
  </section>

  <!-- КАРТОЧКИ -->
  <section class="panel" id="p-cards" role="tabpanel" aria-labelledby="t-cards" hidden>
    <button class="stage card" id="c-card" type="button" aria-label="Перевернуть карточку">
      <div class="meta" id="c-meta"></div>
      <div class="gr" id="c-gr" lang="el"></div>
      <div class="ru hide" id="c-ru"></div>
      <div class="forms" id="c-forms" lang="el" hidden></div>
      <div class="hint" id="c-hint">Нажми на карточку, чтобы увидеть перевод</div>
    </button>
    <div class="ctrls">
      <button class="ib" id="c-prev" type="button" aria-label="Предыдущая"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="ib main" id="c-say" type="button" aria-label="Произнести"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10z"/></svg></button>
      <button class="ib" id="c-next" type="button" aria-label="Следующая"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
    </div>
    <label class="chk" style="justify-content:center"><input id="c-shuf" type="checkbox"> Перемешать</label>
  </section>

  <!-- ТЕСТ -->
  <section class="panel" id="p-quiz" role="tabpanel" aria-labelledby="t-quiz" hidden>
    <div class="stage" style="align-items:stretch;text-align:left">
      <div class="row" style="justify-content:space-between">
        <span class="meta">Выбери перевод</span>
        <span class="score" id="q-score">0 / 0</span>
      </div>
      <div class="row" style="justify-content:center;gap:12px">
        <div class="gr" id="q-gr" lang="el"></div>
        <button class="ib" id="q-say" type="button" aria-label="Произнести" style="width:44px;height:44px"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10z"/></svg></button>
      </div>
      <div class="answers" id="q-ans"></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn pri" id="q-next" type="button" hidden>Дальше</button>
      <button class="btn" id="q-reset" type="button">Начать заново</button>
    </div>
    <label class="chk" style="justify-content:center"><input id="q-auto" type="checkbox"> Озвучивать слово в вопросе</label>
  </section>

  <!-- ГРАММАТИКА -->
  <section class="panel" id="p-gram" hidden>
    <div class="stage" aria-live="polite">
      <div class="flabel" id="g-lab"></div>
      <div id="g-main"></div>
      <div class="ru" id="g-tr"></div>
    </div>
    <div class="head">
      <h2>Темы</h2>
      <div class="row" style="gap:10px">
        <button class="linkbtn" id="gt-all" type="button">Все</button>
        <button class="linkbtn" id="gt-none" type="button">Сбросить</button>
      </div>
    </div>
    <div class="topics" id="topics"></div>
    <div class="opts">
      <div class="opt"><label for="o-ggap">Пауза после фразы</label><output id="o-ggap-v"></output>
        <input id="o-ggap" type="range" min="0.5" max="4" step="0.5"></div>
      <div class="opt"><label for="o-rate2">Скорость греческой речи</label><output id="o-rate2-v"></output>
        <input id="o-rate2" type="range" min="0.5" max="1.1" step="0.05"></div>
      <label class="chk"><input id="o-gtr" type="checkbox"> Озвучивать перевод примеров</label>
      <label class="chk"><input id="o-grep" type="checkbox"> Повторять греческие примеры дважды</label>
      <label class="chk"><input id="o-gloop" type="checkbox"> По кругу</label>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <details id="listbox">
    <summary>Список слов (нажми на слово, чтобы услышать)</summary>
    <div class="list" id="list"></div>
  </details>
</div>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="meta" id="d-meta"></div>
    <div class="bar"><i id="d-bar"></i></div>
    <div class="ctrls">
      <button class="ib" id="d-prev" type="button" aria-label="Предыдущее слово"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="ib main" id="d-play" type="button" aria-label="Начать диктовку"></button>
      <button class="ib" id="d-next" type="button" aria-label="Следующее слово"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
    </div>
  </div>
</div>

<script>
(function(){

  $("#o-rate2").addEventListener("input",function(){$("#o-rate").value=st.rate;$("#o-rate-v").textContent="×"+st.rate.toFixed(2).replace(".",",")});
  $("#o-rate").addEventListener("input",function(){$("#o-rate2").value=st.rate;$("#o-rate2-v").textContent="×"+st.rate.toFixed(2).replace(".",",")});
  bindChk("o-gtr","gtr");bindChk("o-grep","grep");bindChk("o-gloop","gloop");
  function onGram(){updGCount();if(st.gonly){stopDict();buildDict();renderDict(false)}renderCard()}
  bindChk("g-case","gcase",onGram);bindChk("g-pres","gpres",onGram);bindChk("g-past","gpast",onGram);bindChk("g-fut","gfut",onGram);
  bindChk("g-only","gonly",function(){updGCount();stopDict();buildDict();renderDict(false)});

  /* ---------- карточки ---------- */
  var cpool=[],ci=0,flipped=false;
  function buildCards(){cpool=st.cshuf?shuffle(all):all.slice();ci=0;flipped=false}
  function renderCard(){
    var w=cpool[ci];if(!w)return;
    $("#c-gr").textContent=w.gr;
    var r=$("#c-ru");r.textContent=w.ru;r.className="ru"+(flipped?"":" hide");
    $("#c-hint").hidden=flipped;
    if(flipped)fillForms($("#c-forms"),groupsFor(w.gr));else $("#c-forms").hidden=true;
    $("#c-meta").textContent=(ci+1)+" / "+cpool.length;
  }
  $("#c-card").onclick=function(){flipped=!flipped;renderCard();if(flipped===false)return};
  function cstep(d){stopSpeech();ci=(ci+d+cpool.length)%cpool.length;flipped=false;renderCard();speak(cpool[ci].gr,"el",st.rate)}
  $("#c-next").onclick=function(){cstep(1)};
  $("#c-prev").onclick=function(){cstep(-1)};
  $("#c-say").onclick=function(){stopSpeech();speak(cpool[ci].gr,"el",st.rate)};
  bindChk("c-shuf","cshuf",function(){buildCards();renderCard()});

  /* ---------- тест ---------- */
  var qcur=null,qright=0,qtotal=0,qanswered=false;
  function newQuestion(){
    if(all.length<2){return}
    qanswered=false;$("#q-next").hidden=true;
    var w=all[Math.floor(Math.random()*all.length)];
    var wrong=shuffle(all.filter(function(x){return x.ru!==w.ru})).slice(0,3);
    var opts=shuffle(wrong.concat([w]));
    qcur=w;
    $("#q-gr").textContent=w.gr;
    var box=$("#q-ans");box.textContent="";
    opts.forEach(function(o){
      var b=document.createElement("button");b.type="button";b.className="ans";b.textContent=o.ru;
      b.onclick=function(){
        if(qanswered)return;qanswered=true;qtotal++;
        var ok=o.ru===w.ru;if(ok)qright++;
        Array.prototype.forEach.call(box.children,function(c){
          if(c.textContent===w.ru)c.classList.add("ok");
          else if(c===b)c.classList.add("no");
        });
        $("#q-score").textContent=qright+" / "+qtotal;
        $("#q-next").hidden=false;$("#q-next").focus();
      };
      box.appendChild(b);
    });
    if(st.qauto){stopSpeech();speak(w.gr,"el",st.rate)}
  }
  $("#q-next").onclick=newQuestion;
  $("#q-reset").onclick=function(){qright=0;qtotal=0;$("#q-score").textContent="0 / 0";newQuestion()};
  $("#q-say").onclick=function(){if(qcur){stopSpeech();speak(qcur.gr,"el",st.rate)}};
  bindChk("q-auto","qauto");

  /* ---------- список ---------- */
  function renderList(){
    var box=$("#list");box.textContent="";
    all.forEach(function(w){
      var b=document.createElement("button");b.type="button";b.className="li";
      var g=document.createElement("span");g.className="g";g.lang="el";g.textContent=w.gr;
      var r=document.createElement("span");r.className="r";r.textContent=w.ru;
      b.appendChild(g);b.appendChild(r);
      b.onclick=function(){
        document.querySelectorAll(".li.on").forEach(function(x){x.classList.remove("on")});
        b.classList.add("on");stopDict();speak(w.gr,"el",st.rate);
      };
      box.appendChild(b);
    });
  }

  function rebuildAll(){
    buildDict();renderDict(false);buildCards();renderCard();renderList();updGCount();
    if(st.mode==="quiz")newQuestion();
  }

  document.addEventListener("visibilitychange",function(){if(document.hidden&&playing)stopDict()});

  all=basePool();
  setPlayIcon();renderSets();renderVoice();rebuildAll();buildGQ(selTis());
  if(st.mode!=="dict")setMode(st.mode);
  applyView();
})();
</script>

</body></html>
